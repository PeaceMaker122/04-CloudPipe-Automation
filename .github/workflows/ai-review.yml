name: AI Review

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::104783764104:role/cloudpipe-ai-review-role
          aws-region: us-east-1

      - name: Get PR diff
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git diff origin/"${{ github.event.pull_request.base.ref }}"...HEAD > pr.diff

      - name: Run Bedrock AI review
        continue-on-error: true
        env:
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'anthropic.claude-sonnet-4-5-20250929-v1:0' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'EOF'
          import json
          import os
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          model_id = os.environ["BEDROCK_MODEL_ID"]

          with open("pr.diff", "r", encoding="utf-8") as f:
              diff = f.read()
          # Keep the diff within the model's context window.
          if len(diff) > 60000:
              diff = diff[:60000]

          prompt = (
              "You are a code reviewer for a website deployment pipeline. "
              "Review the pull request diff below and flag anything worth a second "
              "look: potential secrets or API keys, unusually large or risky changes, "
              "and obviously missing files. Be concise. Do not approve or reject the "
              "change; a human makes the final call.\n\n"
              f"<diff>\n{diff}\n</diff>"
          )

          bedrock = boto3.client("bedrock-runtime", region_name="us-east-1")
          try:
              body = json.dumps({
                  "anthropic_version": "bedrock-2023-05-31",
                  "max_tokens": 2048,
                  "messages": [{"role": "user", "content": prompt}],
              })
              response = bedrock.invoke_model(
                  modelId=model_id,
                  body=body,
                  contentType="application/json",
                  accept="application/json",
              )
              result = json.loads(response["body"].read())
              review = result["content"][0]["text"]
          except ClientError as e:
              print(f"Bedrock error: {e}")
              raise

          body = f"### AI Review\n\n{review}"
          payload = json.dumps({"body": body}).encode("utf-8")
          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          req = urllib.request.Request(
              f"{api}/repos/{repo}/issues/{pr}/comments",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(f"Posted AI review comment, status {resp.status}")
          EOF