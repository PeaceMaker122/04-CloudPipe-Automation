name: Deploy to Staging

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::104783764104:role/cloudpipe-staging-deploy-role
          aws-region: us-east-1

      - name: Deploy to staging S3
        run: aws s3 sync ./website s3://<staging-bucket-name> --delete

      - name: Invalidate staging CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id <staging-distribution-id> --paths "/*"