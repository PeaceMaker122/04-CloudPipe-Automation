name: Deploy to Staging

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Print OIDC token claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "=== OIDC token claims ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null || true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::104783764104:role/cloudpipe-staging-deploy-role
          aws-region: us-east-1

      - name: Deploy to staging S3
        run: aws s3 sync ./website s3://infrastructurestack-stagingbucket9644c37c-z4nik62whxhv --delete

      - name: Invalidate staging CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E2VT0HGFFZW1YO --paths "/*"